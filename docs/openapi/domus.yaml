openapi: 3.1.0
info:
  title: Domus API
  version: "1.0.0"
  description: REST API for the Domus local-first smart home hub running on Raspberry Pi.

servers:
  - url: http://localhost:8080/api/v1
    description: Local development hub

security:
  - cookieAuth: []

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: domus_session

  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object

    Entity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        entity_key:
          type: string
          example: "light.living_room"
        domain:
          type: string
          example: "light"
        name:
          type: string
        icon:
          type: string
        unit_of_measurement:
          type: string
          nullable: true
        writable:
          type: boolean
        state:
          type: object
        attributes:
          type: object
        available:
          type: boolean
        area_id:
          type: string
          nullable: true
        device_id:
          type: string
          nullable: true
        last_changed_at:
          type: string
          format: date-time
        last_updated_at:
          type: string
          format: date-time

    Device:
      type: object
      properties:
        id:
          type: string
          format: uuid
        integration_id:
          type: string
        external_id:
          type: string
        name:
          type: string
        manufacturer:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        area_id:
          type: string
          nullable: true
        online:
          type: boolean
        entities:
          type: array
          items:
            $ref: "#/components/schemas/Entity"

    Area:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        icon:
          type: string
          nullable: true
        parent_area_id:
          type: string
          nullable: true
        sort_order:
          type: integer

    Automation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        trigger:
          type: object
        conditions:
          type: array
          items:
            type: object
        actions:
          type: array
          items:
            type: object
        execution_mode:
          type: string
          enum: [single, restart, queued]
        cooldown_seconds:
          type: integer
        last_run_at:
          type: string
          format: date-time
          nullable: true
        last_status:
          type: string
          nullable: true

    AutomationRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        automation_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [running, success, failed, cancelled]
        trigger_context:
          type: object
        log:
          type: string

    Scene:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        icon:
          type: string
          nullable: true
        actions:
          type: array
          items:
            type: object

    CommandRequest:
      type: object
      required: [service]
      properties:
        service:
          type: string
          example: "turn_on"
        params:
          type: object
          example:
            brightness: 200

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          nullable: true
        role:
          type: string
          enum: [admin, operator, viewer]
        enabled:
          type: boolean

paths:
  /system/health:
    get:
      summary: Health check
      tags: [System]
      security: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  version:
                    type: string
                  uptime_s:
                    type: integer
                  database:
                    type: string
                    example: "healthy"

  /auth/setup:
    post:
      summary: Setup initial admin user on first launch
      tags: [Auth]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "201":
          description: Admin created
        "409":
          description: Setup already completed

  /auth/login:
    post:
      summary: User login
      tags: [Auth]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in, session cookie set
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          description: Invalid credentials
        "429":
          description: Rate limit exceeded

  /auth/logout:
    post:
      summary: User logout
      tags: [Auth]
      responses:
        "204":
          description: Session terminated

  /auth/me:
    get:
      summary: Get currently authenticated user
      tags: [Auth]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /entities:
    get:
      summary: List registered entities
      tags: [Entities]
      parameters:
        - in: query
          name: domain
          schema:
            type: string
        - in: query
          name: area_id
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entity"

  /entities/{id}:
    get:
      summary: Get entity details by ID
      tags: [Entities]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entity"
        "404":
          description: Entity not found

  /entities/{id}/command:
    post:
      summary: Dispatch command to entity
      tags: [Entities]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandRequest"
      responses:
        "202":
          description: Command accepted for asynchronous processing
        "400":
          description: Invalid command
        "403":
          description: Entity is not writable

  /entities/{id}/history:
    get:
      summary: Get historical state changes for entity
      tags: [Entities]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            maximum: 1000
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    state:
                      type: object
                    recorded_at:
                      type: string
                      format: date-time

  /devices:
    get:
      summary: List registered devices
      tags: [Devices]
      parameters:
        - in: query
          name: area_id
          schema:
            type: string
        - in: query
          name: online
          schema:
            type: boolean
        - in: query
          name: integration_id
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"

  /areas:
    get:
      summary: List configured areas
      tags: [Areas]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Area"
    post:
      summary: Create new area
      tags: [Areas]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Area"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"

  /automations:
    get:
      summary: List automations
      tags: [Automations]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Automation"
    post:
      summary: Create automation rule
      tags: [Automations]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Automation"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"

  /scenes:
    get:
      summary: List scenes
      tags: [Scenes]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scene"
    post:
      summary: Create scene
      tags: [Scenes]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Scene"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scene"

  /scenes/{id}/activate:
    post:
      summary: Trigger scene activation
      tags: [Scenes]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Scene activation dispatched
