openapi: 3.1.0
info:
  title: Domus API
  version: "1.0.0"
  description: REST API for the Domus local-first smart home hub running on Raspberry Pi.

servers:
  - url: http://localhost:8080/api/v1
    description: Local development hub

security:
  - cookieAuth: []

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: domus_session

  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object

    Entity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        entity_key:
          type: string
          example: "light.living_room"
        domain:
          type: string
          example: "light"
        name:
          type: string
        icon:
          type: string
        unit_of_measurement:
          type: string
          nullable: true
        writable:
          type: boolean
        state:
          type: object
        attributes:
          type: object
        available:
          type: boolean
        area_id:
          type: string
          nullable: true
        device_id:
          type: string
          nullable: true
        last_changed_at:
          type: string
          format: date-time
        last_updated_at:
          type: string
          format: date-time

    Device:
      type: object
      properties:
        id:
          type: string
          format: uuid
        integration_id:
          type: string
        external_id:
          type: string
        name:
          type: string
        manufacturer:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        area_id:
          type: string
          nullable: true
        online:
          type: boolean
        entities:
          type: array
          items:
            $ref: "#/components/schemas/Entity"

    Area:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        icon:
          type: string
          nullable: true
        parent_area_id:
          type: string
          nullable: true
        sort_order:
          type: integer

    Automation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        trigger:
          type: object
        conditions:
          type: array
          items:
            type: object
        actions:
          type: array
          items:
            type: object
        execution_mode:
          type: string
          enum: [single, restart, queued]
        cooldown_seconds:
          type: integer
        last_run_at:
          type: string
          format: date-time
          nullable: true
        last_status:
          type: string
          nullable: true

    AutomationRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        automation_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [running, success, failed, cancelled]
        trigger_context:
          type: object
        log:
          type: string

    Scene:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        icon:
          type: string
          nullable: true
        actions:
          type: array
          items:
            type: object

    CommandRequest:
      type: object
      required: [service]
      properties:
        service:
          type: string
          example: "turn_on"
        params:
          type: object
          example:
            brightness: 200

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          nullable: true
        role:
          type: string
          enum: [admin, operator, viewer]
        enabled:
          type: boolean

    FamilyInvite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
        role:
          type: string
          enum: [admin, operator, viewer]
        expires_at:
          type: string
          format: date-time
        used_at:
          type: string
          format: date-time
          nullable: true
        used_by:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    DynamicTariff:
      type: object
      properties:
        source: { type: string, example: "PUN" }
        currency: { type: string, example: "EUR/MWh" }
        current_price: { type: number, example: 104.5 }
        hourly_prices:
          type: array
          items:
            type: object
            properties:
              hour: { type: integer, example: 14 }
              price: { type: number, example: 89.2 }
              category: { type: string, enum: [low, medium, high] }

    FlexibleLoad:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        entity_id: { type: string }
        power_w: { type: integer }
        duration_minutes: { type: integer }
        deadline_hour: { type: integer }
        enabled: { type: boolean }

    Camera:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        stream_url: { type: string }
        area_id: { type: string, nullable: true }
        ai_enabled: { type: boolean }
        status: { type: string }

    CameraZone:
      type: object
      properties:
        id: { type: string }
        camera_id: { type: string }
        name: { type: string }
        polygon:
          type: array
          items:
            type: object
            properties:
              x: { type: number }
              y: { type: number }

    CameraEvent:
      type: object
      properties:
        id: { type: string }
        camera_id: { type: string }
        label: { type: string, example: "person" }
        confidence: { type: number, example: 0.94 }
        timestamp: { type: string, format: date-time }
        clip_url: { type: string, nullable: true }

    FirmwareManifest:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        chip: { type: string, example: "ESP32" }
        baud_rate: { type: integer, example: 460800 }
        bin_url: { type: string }

    FailoverStatus:
      type: object
      properties:
        node_role: { type: string, enum: [primary, secondary] }
        peer_address: { type: string }
        peer_alive: { type: boolean }
        vip_address: { type: string }
        wal_sync_lag_bytes: { type: integer }
        last_heartbeat_at: { type: string, format: date-time }

    Satellite:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        area_id: { type: string }
        ip_address: { type: string }
        wake_word: { type: string, example: "Ehi Domus" }
        muted: { type: boolean }
        status: { type: string }

    AlarmPanel:
      type: object
      properties:
        state: { type: string, enum: [disarmed, armed_home, armed_away, armed_night, triggered, pending] }
        changed_at: { type: string, format: date-time }
        entry_delay_seconds: { type: integer }
        exit_delay_seconds: { type: integer }

    DeviceBinding:
      type: object
      properties:
        id: { type: string }
        source_device_id: { type: string }
        target_device_id: { type: string }
        cluster: { type: string, example: "on_off" }
        created_at: { type: string, format: date-time }

    ShoppingItem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string, example: "produce" }
        quantity: { type: string, example: "1 kg" }
        completed: { type: boolean }
        created_at: { type: string, format: date-time }

    DiscoveredDevice:
      type: object
      properties:
        id: { type: string }
        brand: { type: string, example: "shelly" }
        name: { type: string }
        ip_address: { type: string }
        mac_address: { type: string }
        paired: { type: boolean }

paths:
  /system/health:
    get:
      summary: Health check
      tags: [System]
      security: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  version:
                    type: string
                  uptime_s:
                    type: integer
                  database:
                    type: string
                    example: "healthy"

  /auth/setup:
    post:
      summary: Setup initial admin user on first launch
      tags: [Auth]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "201":
          description: Admin created
        "409":
          description: Setup already completed

  /auth/login:
    post:
      summary: User login
      tags: [Auth]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in, session cookie set
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          description: Invalid credentials
        "429":
          description: Rate limit exceeded

  /auth/logout:
    post:
      summary: User logout
      tags: [Auth]
      responses:
        "204":
          description: Session terminated

  /auth/me:
    get:
      summary: Get currently authenticated user
      tags: [Auth]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /auth/invite/{token}:
    get:
      summary: Validate an invitation token
      tags: [Auth]
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite valid
        "400":
          description: Invite expired or already used
        "404":
          description: Invite not found

  /auth/register:
    post:
      summary: Register as a family member using an invitation token
      tags: [Auth]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token, username, password]
              properties:
                token:
                  type: string
                username:
                  type: string
                password:
                  type: string
                  format: password
                email:
                  type: string
                  nullable: true
      responses:
        "201":
          description: User registered and authenticated, session cookie set
          headers:
            Set-Cookie:
              schema:
                type: string
        "400":
          description: Invalid input or expired invite
        "409":
          description: Username already taken

  /family/members:
    get:
      summary: List all household family members
      tags: [Family]
      responses:
        "200":
          description: List of family members
        "401":
          description: Authentication required

  /family/members/{id}/role:
    put:
      summary: Update a family member's permission role (Admin only)
      tags: [Family]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [admin, operator, viewer]
      responses:
        "200":
          description: Role updated
        "400":
          description: Cannot demote the last administrator
        "403":
          description: Insufficient permissions

  /family/members/{id}:
    delete:
      summary: Remove a family member (Admin only)
      tags: [Family]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Member removed
        "400":
          description: Cannot remove self or last administrator
        "403":
          description: Insufficient permissions

  /family/invites:
    get:
      summary: List active family registration invites (Admin only)
      tags: [Family]
      responses:
        "200":
          description: List of active invites
        "403":
          description: Insufficient permissions
    post:
      summary: Create a family registration invite link (Admin only)
      tags: [Family]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [admin, operator, viewer]
                expires_in_hours:
                  type: integer
                  default: 48
      responses:
        "201":
          description: Invite generated with token and link
        "403":
          description: Insufficient permissions

  /family/invites/{id}:
    delete:
      summary: Revoke an active registration invite (Admin only)
      tags: [Family]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Invite revoked
        "403":
          description: Insufficient permissions

  /entities:
    get:
      summary: List registered entities
      tags: [Entities]
      parameters:
        - in: query
          name: domain
          schema:
            type: string
        - in: query
          name: area_id
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entity"

  /entities/{id}:
    get:
      summary: Get entity details by ID
      tags: [Entities]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entity"
        "404":
          description: Entity not found

  /entities/{id}/command:
    post:
      summary: Dispatch command to entity
      tags: [Entities]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandRequest"
      responses:
        "202":
          description: Command accepted for asynchronous processing
        "400":
          description: Invalid command
        "403":
          description: Entity is not writable

  /entities/{id}/history:
    get:
      summary: Get historical state changes for entity
      tags: [Entities]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            maximum: 1000
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    state:
                      type: object
                    recorded_at:
                      type: string
                      format: date-time

  /devices:
    get:
      summary: List registered devices
      tags: [Devices]
      parameters:
        - in: query
          name: area_id
          schema:
            type: string
        - in: query
          name: online
          schema:
            type: boolean
        - in: query
          name: integration_id
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"

  /areas:
    get:
      summary: List configured areas
      tags: [Areas]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Area"
    post:
      summary: Create new area
      tags: [Areas]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Area"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"

  /areas/{id}:
    get:
      summary: Get area by ID
      tags: [Areas]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"
        "404":
          description: Area not found
    put:
      summary: Update area
      tags: [Areas]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Area"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"
        "404":
          description: Area not found
    delete:
      summary: Delete area
      tags: [Areas]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Area deleted
        "404":
          description: Area not found

  /automations:
    get:
      summary: List automations
      tags: [Automations]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Automation"
    post:
      summary: Create automation rule
      tags: [Automations]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Automation"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"

  /scenes:
    get:
      summary: List scenes
      tags: [Scenes]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scene"
    post:
      summary: Create scene
      tags: [Scenes]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Scene"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scene"

  /scenes/{id}/activate:
    post:
      summary: Trigger scene activation
      tags: [Scenes]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Scene activation dispatched

  # ── TELEMETRY & HISTORY ─────────────────────────────────────────
  /entities/{id}/history:
    get:
      summary: Query entity state history
      tags: [History]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: from
          required: false
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          required: false
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 100
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    entity_id: { type: string }
                    state: { type: object }
                    recorded_at: { type: string, format: date-time }

  # ── INTEGRATIONS ───────────────────────────────────────────────
  /integrations:
    get:
      summary: List registered hardware and cloud integrations
      tags: [Integrations]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    type: { type: string }
                    name: { type: string }
                    enabled: { type: boolean }
                    status: { type: string }
                    last_error: { type: string }
  /integrations/{id}/reconnect:
    post:
      summary: Trigger reconnection for an integration adapter
      tags: [Integrations]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  message: { type: string }

  # ── SYSTEM & METRICS ───────────────────────────────────────────
  /system/health:
    get:
      summary: Health check status
      tags: [System]
      security: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  version: { type: string }
                  uptime_s: { type: integer }
                  database: { type: string }

  /system/metrics:
    get:
      summary: Live hub operational metrics
      tags: [System]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  uptime_s: { type: integer }
                  entity_count: { type: integer }
                  device_count: { type: integer }
                  mqtt_connected: { type: boolean }
                  ws_clients: { type: integer }
                  db_size_bytes: { type: integer }

  # ── AUDIT ───────────────────────────────────────────────────────
  /audit:
    get:
      summary: Security audit log entries
      tags: [Audit]
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        actor_type: { type: string }
                        actor_id: { type: string, nullable: true }
                        action: { type: string }
                        target_type: { type: string, nullable: true }
                        target_id: { type: string, nullable: true }
                        payload: { type: object }
                        created_at: { type: string, format: date-time }
                  total: { type: integer }

  # ── ENERGY & DYNAMIC TARIFFS ───────────────────────────────────
  /energy/tariffs:
    get:
      summary: Get active dynamic electricity tariffs
      tags: [Energy]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DynamicTariff"

  /energy/dynamic-tariffs:
    get:
      summary: Get 24-hour hourly dynamic prices curve
      tags: [Energy]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    hour: { type: integer }
                    price: { type: number }
                    category: { type: string }

  /energy/flexible-loads:
    put:
      summary: Update flexible appliance load schedules
      tags: [Energy]
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/FlexibleLoad"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "updated" }

  /energy/evaluate-tariffs:
    post:
      summary: Manually trigger tariff evaluation and load rescheduling
      tags: [Energy]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  scheduled_loads: { type: integer }

  # ── CAMERAS & AI COMPUTER VISION NVR ───────────────────────────
  /cameras:
    get:
      summary: List registered cameras
      tags: [Cameras]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Camera"
    post:
      summary: Register a new RTSP / WebRTC camera
      tags: [Cameras]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Camera"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Camera"

  /cameras/nvr/status:
    get:
      summary: Get local AI NVR pipeline status and statistics
      tags: [Cameras]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  running: { type: boolean }
                  model: { type: string, example: "onnx-yolo-nano" }
                  fps: { type: number }
                  active_streams: { type: integer }

  /cameras/{id}/webrtc:
    post:
      summary: Negotiate WebRTC session description (SDP)
      tags: [Cameras]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sdp: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  sdp: { type: string }

  /cameras/{id}/zones:
    get:
      summary: List motion zones for a camera
      tags: [Cameras]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CameraZone"
    post:
      summary: Save a motion zone for a camera
      tags: [Cameras]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CameraZone"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraZone"

  /cameras/events:
    get:
      summary: List AI detection vision events
      tags: [Cameras]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CameraEvent"

  /cameras/events/{id}/clip:
    get:
      summary: Download or view animated event snapshot clip
      tags: [Cameras]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            image/webp:
              schema: { type: string, format: binary }
            video/mp4:
              schema: { type: string, format: binary }

  # ── OTA & WEBSERIAL FIRMWARE FLASHER ───────────────────────────
  /ota/devices:
    get:
      summary: List OTA-capable microcontrollers
      tags: [OTA]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    current_version: { type: string }
                    latest_version: { type: string }

  /ota/flasher/catalog:
    get:
      summary: List firmwares supported by in-browser WebSerial flasher
      tags: [OTA]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FirmwareManifest"

  /ota/flasher/{id}/manifest:
    get:
      summary: Get binary manifest and flash partition offsets
      tags: [OTA]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmwareManifest"

  /ota/flasher/provision:
    post:
      summary: Generate Wi-Fi and MQTT provisioning payload for flashed MCU
      tags: [OTA]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [ssid, password]
              properties:
                ssid: { type: string }
                password: { type: string }
                hub_ip: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  config_payload: { type: string }

  # ── FAILOVER DUAL-HUB ──────────────────────────────────────────
  /system/failover/status:
    get:
      summary: Get cluster high availability failover status
      tags: [System]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailoverStatus"

  /system/failover/heartbeat:
    post:
      summary: Receive peer heartbeat ping
      tags: [System]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  ack: { type: boolean }

  /system/failover/promote:
    post:
      summary: Manually promote node to active cluster leader
      tags: [System]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  promoted: { type: boolean }
                  role: { type: string, example: "primary" }

  # ── VOICE ASSISTANT & SATELLITES ───────────────────────────────
  /assistant/chat:
    post:
      summary: Send prompt to local voice/text assistant
      tags: [Assistant]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  response: { type: string }

  /assistant/config:
    get:
      summary: Get assistant configuration
      tags: [Assistant]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  wake_word: { type: string }
    put:
      summary: Update assistant configuration
      tags: [Assistant]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                wake_word: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }

  /assistant/satellites:
    get:
      summary: List registered multi-room voice satellites
      tags: [Assistant]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Satellite"
    post:
      summary: Register a new voice satellite
      tags: [Assistant]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Satellite"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Satellite"

  # ── ALARM CONTROL PANEL ────────────────────────────────────────
  /alarm:
    get:
      summary: Get security alarm control panel state
      tags: [Alarm]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlarmPanel"

  /alarm/arm:
    post:
      summary: Arm alarm in specified mode
      tags: [Alarm]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [mode, pin]
              properties:
                mode: { type: string, enum: [armed_home, armed_away, armed_night] }
                pin: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlarmPanel"

  /alarm/disarm:
    post:
      summary: Disarm alarm using PIN
      tags: [Alarm]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlarmPanel"

  /alarm/trigger:
    post:
      summary: Trigger emergency panic alarm
      tags: [Alarm]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlarmPanel"

  # ── MESH DIRECT BINDINGS ───────────────────────────────────────
  /devices/bindings:
    get:
      summary: List Zigbee direct bindings
      tags: [Mesh]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceBinding"
    post:
      summary: Create a direct device-to-device Zigbee binding
      tags: [Mesh]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceBinding"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceBinding"

  /devices/bindings/{id}:
    delete:
      summary: Remove a Zigbee direct binding
      tags: [Mesh]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Binding deleted

  # ── SHARED SHOPPING LIST ───────────────────────────────────────
  /shopping:
    get:
      summary: List shared family shopping items
      tags: [Shopping]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShoppingItem"
    post:
      summary: Add an item to the shopping list
      tags: [Shopping]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShoppingItem"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingItem"

  /shopping/{id}/toggle:
    post:
      summary: Toggle bought status of a shopping item
      tags: [Shopping]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingItem"

  /shopping/{id}:
    delete:
      summary: Remove an item from the shopping list
      tags: [Shopping]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Item removed

  /shopping/clear-completed:
    post:
      summary: Remove all completed items from the shopping list
      tags: [Shopping]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: integer }

  # ── BRAND DISCOVERY & 1-CLICK LAN PAIRING ──────────────────────
  /integrations/catalog:
    get:
      summary: List supported brand integrations catalog
      tags: [Integrations]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    brand: { type: string }
                    name: { type: string }
                    category: { type: string }
                    icon: { type: string }

  /integrations/discovery/devices:
    get:
      summary: List discovered LAN devices awaiting pairing
      tags: [Integrations]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiscoveredDevice"

  /integrations/discovery/scan:
    post:
      summary: Trigger active network scan for smart home devices
      tags: [Integrations]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  discovered_count: { type: integer }

  /integrations/discovery/pair:
    post:
      summary: Pair a discovered LAN device with 1-click
      tags: [Integrations]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id: { type: string }
                area_id: { type: string, nullable: true }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  paired: { type: boolean }
                  device_id: { type: string }
