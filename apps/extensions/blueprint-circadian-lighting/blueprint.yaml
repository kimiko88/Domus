blueprint:
  name: "Illuminazione Circadiana Adattiva (Sun-Sync)"
  description: "Aggiorna la temperatura colore Kelvin e l'intensità delle luci accese ogni 5 minuti seguendo la curva del ritmo circadiano solare."
  domain: "automation"
  author: "Domus Automation Team"
  version: "2.1.0"
  input:
    target_lights:
      name: Luci da controllare
      description: Seleziona le lampadine CCT/RGBW che devono seguire il ciclo solare.
      selector:
        target:
          entity:
            domain: light

    min_color_temp:
      name: Temperatura Minima Sera/Notte (K)
      default: 2700
      selector:
        number:
          min: 2000
          max: 3500
          step: 50
          unit_of_measurement: "K"

    max_color_temp:
      name: Temperatura Massima Mezzogiorno (K)
      default: 5500
      selector:
        number:
          min: 4000
          max: 6500
          step: 50
          unit_of_measurement: "K"

trigger:
  - platform: time_pattern
    minutes: "/5"
  - platform: state
    entity_id: !input target_lights
    to: "on"

condition:
  - condition: state
    entity_id: !input target_lights
    state: "on"

action:
  - service: light.turn_on
    target:
      entity_id: !input target_lights
    data:
      color_temp_kelvin: >-
        {{ (states('sensor.sun_elevation') | float * 45 + 2700) | round | min(5500) | max(2700) }}
      transition: 5
