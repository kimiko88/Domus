# ─── Domus OS - Genimage Configuration (GPT A/B Partition Layout) ─────────────
# Generates the complete raw flashable disk image: domus-os-rpi4.img
# Target: Raspberry Pi 4 Model B (USB 3 SSD & microSD)

image boot.vfat {
	vfat {
		extraargs = "-F 32 -n domus-boot"
	}
	size = 128M

	file bcm2711-rpi-4-b.dtb {
		image = "bcm2711-rpi-4-b.dtb"
	}

	file overlays {
		image = "rpi-firmware/overlays"
	}

	file fixup4.dat {
		image = "rpi-firmware/fixup4.dat"
	}

	file start4.elf {
		image = "rpi-firmware/start4.elf"
	}

	file config.txt {
		image = "config.txt"
	}

	file cmdline.txt {
		image = "cmdline.txt"
	}

	file u-boot.bin {
		image = "u-boot.bin"
	}

	file boot.scr {
		image = "boot.scr"
	}

	file Image {
		image = "Image"
	}
}

image data.ext4 {
	ext4 {
		label = "domus-data"
		features = "^huge_file"
	}
	size = 512M
}

image domus-os-rpi4.img {
	hdimage {
		partition-table-type = "gpt"
		disk-signature = 0x444f4d53 # "DOMS" signature
	}

	partition domus-boot {
		partition-type-uuid = "c12a7328-f81f-11d2-ba4b-00a0c93ec93b"
		bootable = "true"
		image = "boot.vfat"
		offset = 4M
	}

	partition domus-root-a {
		partition-type-uuid = "0fc63daf-8483-4772-8e79-3d69d8477de4"
		image = "rootfs.squashfs"
		size = 1200M
	}

	partition domus-root-b {
		partition-type-uuid = "0fc63daf-8483-4772-8e79-3d69d8477de4"
		image = "rootfs.squashfs"
		size = 1200M
	}

	partition domus-data {
		partition-type-uuid = "0fc63daf-8483-4772-8e79-3d69d8477de4"
		image = "data.ext4"
	}
}
