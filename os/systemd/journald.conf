# ─── Domus OS - Systemd Journald Configuration ──────────────────────────────
# Protects flash storage against wear while preserving persistent diagnostics.

[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=100M
SystemKeepFree=50M
SystemMaxFileSize=10M
MaxRetentionSec=1month
SyncIntervalSec=5m
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToConsole=no
ForwardToWall=no
TTYPath=/dev/tty1
MaxLevelStore=info
MaxLevelSyslog=info
