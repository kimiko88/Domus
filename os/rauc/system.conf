# ─── Domus OS - RAUC System Configuration ─────────────────────────────────────
# Target: Raspberry Pi 4 Model B (Dual-slot A/B redundancy with U-Boot)

[system]
compatible=domus-os-rpi4
bootloader=uboot
mountprefix=/mnt/rauc
statusfile=/data/system/rauc/status

[keyring]
path=/etc/rauc/ca.cert.pem

[slot.rootfs.0]
device=/dev/disk/by-partlabel/domus-root-a
type=raw
bootname=a

[slot.rootfs.1]
device=/dev/disk/by-partlabel/domus-root-b
type=raw
bootname=b

[slot.boot.0]
device=/dev/disk/by-partlabel/domus-boot
type=vfat
parent=rootfs.0
