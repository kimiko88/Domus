# ─── Domus OS - Avahi Daemon Configuration ─────────────────────────────────────
# Configures mDNS / DNS-SD responder for zero-configuration networking.
# Advertises http://domus.local on the local area network.

[server]
host-name=domus
domain-name=local
browse-domains=0pointer.de, zeroconf.org
use-ipv4=yes
use-ipv6=yes
check-response-ttl=no
use-iff-running=yes
enable-dbus=yes
disallow-other-stacks=yes

[publish]
disable-publishing=no
disable-user-service-publishing=no
add-service-cookie=no
publish-addresses=yes
publish-hinfo=yes
publish-workstation=yes
publish-domain=yes

[reflector]
enable-reflector=no
reflect-ipv=no

[rlimits]
rlimit-as=
rlimit-core=0
rlimit-data=4194304
rlimit-fsize=0
rlimit-nofile=768
rlimit-stack=4194304
rlimit-nproc=3
