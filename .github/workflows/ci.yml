name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go tests and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test
        run: npm run test:run
      - name: Build
        run: npm run build

  installer:
    name: Installer syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate installer syntax
        run: bash -n deployments/scripts/install.sh

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --file deployments/docker/Dockerfile --tag domus-ci:test .

  android:
    name: Android unit tests and compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Run Android unit tests
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew test --stacktrace --no-daemon

  ios:
    name: iOS unit tests and simulator build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          fi
          xcodebuild -version
      - name: Run Swift package tests
        working-directory: mobile/ios
        run: swift test --verbose
      - name: Build iOS simulator app
        working-directory: mobile/ios
        run: |
          xcodebuild -project domus/domus.xcodeproj \
            -scheme domus \
            -destination "generic/platform=iOS Simulator" \
            clean build CODE_SIGNING_ALLOWED=NO
