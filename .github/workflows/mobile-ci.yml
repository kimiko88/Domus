name: Mobile Apps CI (Android & iOS)

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

env:
  ACTIONS_RUNNER_FORCE_NODE24: 'true'

jobs:
  test-android:
    name: Android (Unit, Integration, E2E)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Android Unit & Contract Tests
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew test --stacktrace --no-daemon

  test-ios:
    name: iOS (DomusKit Tests & Xcode Build)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Run DomusKit Swift Package Tests
        working-directory: mobile/ios
        run: swift test --verbose

      - name: Build Xcode iOS App (Simulator Validation)
        working-directory: mobile/ios
        run: |
          xcodebuild -project domus/domus.xcodeproj \
            -scheme domus \
            -destination "generic/platform=iOS Simulator" \
            clean build \
            CODE_SIGNING_ALLOWED=NO

      - name: Setup Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Validate Fastlane Configuration
        working-directory: mobile/ios
        run: |
          gem install fastlane --no-document
          fastlane ios build_simulator
