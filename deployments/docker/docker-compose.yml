services:
  domus:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    container_name: domus-hub
    restart: unless-stopped
    ports:
      - "8080:8080"
      # Tuya LAN discovery broadcasts. TCP 6668 is outbound from Domus to devices
      # and intentionally does not need to be published.
      - "6666:6666/udp"
      - "6667:6667/udp"
    environment:
      - DOMUS_SERVER_HOST=0.0.0.0
      - DOMUS_SERVER_PORT=8080
      - DOMUS_SERVER_WEB_DIR=/usr/local/share/domus/web
      - DOMUS_DATABASE_PATH=/data/domus.db
      - DOMUS_LOG_LEVEL=info
      - DOMUS_LOG_FORMAT=json
      - TUYA_CLOUD_CLIENT_ID=${TUYA_CLOUD_CLIENT_ID:-}
      - TUYA_CLOUD_CLIENT_SECRET=${TUYA_CLOUD_CLIENT_SECRET:-}
      - TUYA_CLOUD_BASE_URL=${TUYA_CLOUD_BASE_URL:-https://openapi.tuyaeu.com}
      - TUYA_CLOUD_SCHEMA=${TUYA_CLOUD_SCHEMA:-}
      - TUYA_OAUTH_APP_CLIENT_ID=${TUYA_OAUTH_APP_CLIENT_ID:-}
      - TUYA_OAUTH_APP_CLIENT_SECRET=${TUYA_OAUTH_APP_CLIENT_SECRET:-}
      - TUYA_OAUTH_IDENTIFIER=${TUYA_OAUTH_IDENTIFIER:-}
      - TUYA_OAUTH_AUTHORIZE_URL=${TUYA_OAUTH_AUTHORIZE_URL:-}
      - TUYA_OAUTH_CALLBACK_URL=${TUYA_OAUTH_CALLBACK_URL:-}
      - TUYA_OAUTH_BASE_URL=${TUYA_OAUTH_BASE_URL:-https://openapi.tuyaeu.com}
    volumes:
      - domus_data:/data
    depends_on:
      - mosquitto
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - domus_net

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: domus-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    networks:
      - domus_net

volumes:
  domus_data:
  mosquitto_data:
  mosquitto_log:

networks:
  domus_net:
    driver: bridge
