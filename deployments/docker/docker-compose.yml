services:
  domus:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    container_name: domus-hub
    restart: unless-stopped
    ports:
      - "8080:8080"
      # Tuya LAN discovery broadcasts. TCP 6668 is outbound from Domus to devices
      # and intentionally does not need to be published.
      - "6666:6666/udp"
      - "6667:6667/udp"
    environment:
      - DOMUS_SERVER_HOST=0.0.0.0
      - DOMUS_SERVER_PORT=8080
      - DOMUS_SERVER_WEB_DIR=/usr/local/share/domus/web
      - DOMUS_DATABASE_PATH=/data/domus.db
      - DOMUS_LOG_LEVEL=info
      - DOMUS_LOG_FORMAT=json
      - DOMUS_WHISPER_ENDPOINT=${DOMUS_WHISPER_ENDPOINT:-http://host.docker.internal:10300}
      - DOMUS_PIPER_ENDPOINT=${DOMUS_PIPER_ENDPOINT:-http://host.docker.internal:10301}
      - DOMUS_WHISPER_ADDR=${DOMUS_WHISPER_ADDR:-host.docker.internal:10300}
      - DOMUS_PIPER_ADDR=${DOMUS_PIPER_ADDR:-host.docker.internal:10200}
      - DOMUS_VOICE_LANGUAGE=${DOMUS_VOICE_LANGUAGE:-it}
      - DOMUS_VOICE_MODEL=${DOMUS_VOICE_MODEL:-it_IT-paola-medium}
      - DOMUS_VOICE_SATELLITES_JSON=${DOMUS_VOICE_SATELLITES_JSON:-[]}
      - DOMUS_OPENDISPLAY_ENABLED=${DOMUS_OPENDISPLAY_ENABLED:-false}
      - DOMUS_OPENDISPLAY_BRIDGE_URL=${DOMUS_OPENDISPLAY_BRIDGE_URL:-http://host.docker.internal:10320}
      - DOMUS_OPENDISPLAY_BRIDGE_TOKEN=${DOMUS_OPENDISPLAY_BRIDGE_TOKEN:-}
      - DOMUS_OPENDISPLAY_DISCOVERY_INTERVAL=${DOMUS_OPENDISPLAY_DISCOVERY_INTERVAL:-60s}
      - DOMUS_OPENDISPLAY_BLE_SCAN_SECONDS=${DOMUS_OPENDISPLAY_BLE_SCAN_SECONDS:-6}
      - DOMUS_OPENDISPLAY_HTTP_TIMEOUT=${DOMUS_OPENDISPLAY_HTTP_TIMEOUT:-45s}
      - DOMUS_STORE_TRUSTED_KEYS_JSON=${DOMUS_STORE_TRUSTED_KEYS_JSON:-{}}
      - DOMUS_STORE_ALLOW_UNTRUSTED_REPOSITORIES=${DOMUS_STORE_ALLOW_UNTRUSTED_REPOSITORIES:-false}
      - DOMUS_STORE_INSTALL_ROOT=${DOMUS_STORE_INSTALL_ROOT:-/data/marketplace}
      - DOMUS_STORE_MAX_ARTIFACT_BYTES=${DOMUS_STORE_MAX_ARTIFACT_BYTES:-16777216}
      - DOMUS_VERSION=${DOMUS_VERSION:-1.0.0-dev}
      - TUYA_CLOUD_CLIENT_ID=${TUYA_CLOUD_CLIENT_ID:-}
      - TUYA_CLOUD_CLIENT_SECRET=${TUYA_CLOUD_CLIENT_SECRET:-}
      - TUYA_CLOUD_BASE_URL=${TUYA_CLOUD_BASE_URL:-https://openapi.tuyaeu.com}
      - TUYA_CLOUD_SCHEMA=${TUYA_CLOUD_SCHEMA:-}
      - TUYA_OAUTH_APP_CLIENT_ID=${TUYA_OAUTH_APP_CLIENT_ID:-}
      - TUYA_OAUTH_APP_CLIENT_SECRET=${TUYA_OAUTH_APP_CLIENT_SECRET:-}
      - TUYA_OAUTH_IDENTIFIER=${TUYA_OAUTH_IDENTIFIER:-}
      - TUYA_OAUTH_AUTHORIZE_URL=${TUYA_OAUTH_AUTHORIZE_URL:-}
      - TUYA_OAUTH_CALLBACK_URL=${TUYA_OAUTH_CALLBACK_URL:-}
      - TUYA_OAUTH_BASE_URL=${TUYA_OAUTH_BASE_URL:-https://openapi.tuyaeu.com}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - domus_data:/data
    depends_on:
      - mosquitto
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - domus_net

  opendisplay-bridge:
    profiles: ["opendisplay"]
    build:
      context: ../../deployments/opendisplay-bridge
      dockerfile: Dockerfile
    container_name: domus-opendisplay-bridge
    restart: unless-stopped
    network_mode: host
    environment:
      - OPENDISPLAY_BRIDGE_BIND=${OPENDISPLAY_BRIDGE_BIND:-0.0.0.0}
      - OPENDISPLAY_BRIDGE_PORT=${OPENDISPLAY_BRIDGE_PORT:-10320}
      - OPENDISPLAY_BRIDGE_TOKEN=${DOMUS_OPENDISPLAY_BRIDGE_TOKEN:-}
      - OPENDISPLAY_BRIDGE_DEVICE_KEYS_JSON=${OPENDISPLAY_BRIDGE_DEVICE_KEYS_JSON:-{}}
      - OPENDISPLAY_BRIDGE_BLE_SCAN_SECONDS=${OPENDISPLAY_BRIDGE_BLE_SCAN_SECONDS:-6}
      - OPENDISPLAY_BRIDGE_ENABLE_WIFI=${OPENDISPLAY_BRIDGE_ENABLE_WIFI:-true}
    volumes:
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10320/health', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: domus-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    networks:
      - domus_net

volumes:
  domus_data:
  mosquitto_data:
  mosquitto_log:

networks:
  domus_net:
    driver: bridge
