# Publicly reachable Tuya OAuth callback proxy.
# cloudflared must target http://127.0.0.1:8787, never Domus directly.
server {
    listen 127.0.0.1:8787 default_server;
    server_name _;

    # OAuth code/state arrive as query parameters. Never write request URIs to
    # Nginx access logs on this public callback listener.
    access_log off;
    error_log /var/log/nginx/domus-tuya-oauth-error.log warn;

    location = /api/v1/integrations/tuya-oauth/callback {
        limit_except GET {
            deny all;
        }

        # No URI suffix: preserve the exact callback path and query string.
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8080;
        proxy_set_header Connection "";

        # Do not trust client-supplied forwarding headers. Domus deliberately
        # uses the TCP peer address as its source of truth.
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
    }

    location / {
        return 404;
    }
}
