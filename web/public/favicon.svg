<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="128" height="128" rx="32" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="124" height="124" rx="30" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2"/>

  <!-- Glowing House Silhouette -->
  <g filter="url(#glow)">
    <!-- Roof with Chimney -->
    <path d="M64 24 L22 60 L32 60 L32 100 L54 100 L54 78 L74 78 L74 100 L96 100 L96 60 L106 60 Z"
          fill="none" stroke="url(#houseGrad)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Chimney accent -->
    <path d="M84 42 L84 32 L94 32 L94 51" fill="none" stroke="url(#houseGrad)" stroke-width="5" stroke-linejoin="round"/>
    
    <!-- Smart Nexus Core in center -->
    <circle cx="64" cy="56" r="6" fill="url(#nexusGrad)"/>
    <path d="M64 42 L64 50 M64 62 L64 70 M50 56 L58 56 M70 56 L78 56 M54 46 L60 52 M74 66 L68 60 M74 46 L68 52 M54 66 L60 60"
          stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
